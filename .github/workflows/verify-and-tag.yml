name: Verify Assignment 4 and create v1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install plotting dependency
        run: python -m pip install -r requirements.txt

      - name: Run JUnit 5 tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Regenerate PNG plots from the committed CSV
        run: python scripts/plot_results.py

      - name: Commit generated plots and create the v1.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/plots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(results): regenerate experiment plots"
            git push origin HEAD:main
          fi
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.0 >/dev/null 2>&1; then
            git tag -a v1.0 -m "Assignment 4 final version"
            git push origin v1.0
          fi
